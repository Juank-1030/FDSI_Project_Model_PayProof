# Evolution API - canal de WhatsApp no oficial (solo DEMO)
# Levantar:  docker compose -f docker/evolution/docker-compose.yml up -d
# Nota: usa el protocolo de WhatsApp Web (Baileys). Riesgo de ban del numero:
# usa un numero desechable, nunca el personal.

services:
  evolution-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 10

  evolution-api:
    image: evoapicloud/evolution-api:latest
    ports:
      - "8080:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-clave-demo-payproof}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-db:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_REDIS_URI: ""
      CACHE_LOCAL_ENABLED: "false"
      LANGUAGE: es
      CONFIG_SESSION_PHONE_CLIENT: PayProof
      QRCODE_LIMIT: 20
    depends_on:
      evolution-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  evolution_db:
